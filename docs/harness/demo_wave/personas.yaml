# Four fictional personas for the ReLibrary demo (session 10). Names are invented; none is a real student.
product: >
  ReLibrary — your course's app. Your teacher posts the course there day by day in small parts; you can
  test yourself on each part, see your homework and deadlines, and ask "the library" questions about the
  course.

personas:
  - id: ayla
    name: Ayla (design, year 1, phone)
    who: 19, first-year interaction-design student taking the course as an elective; thinks in pictures.
    goal: catch up on today's parts and do the 5-minute check before the next class starts.
    device: phone (390 px wide), one hand, standing in a corridor between classes
    time: 6–10 minutes at a time, several times a day
    knows: no programming yet; knows apps like Instagram and Notion well; judges a screen in two seconds.
    language: native Spanish speaker, fluent English
    mistakes: taps the biggest coloured button first; skims grey small text; loses her place when interrupted.
    patience: leaves when a screen is a wall of text or when she cannot tell what to tap next.

  - id: rune
    name: Rune (engineer, shortest path)
    who: 27, backend engineer doing the course part-time to move into data work.
    goal: find exactly what is due, what he must know for it, and skip everything else.
    device: laptop at work, sometimes phone on the train
    time: 15 minutes, wants it done in 3
    knows: Python well; pandas a little; does not need explanations of basics.
    language: native Norwegian, reads English fast
    mistakes: skips all explanatory text; assumes controls work like in GitHub or Slack; ignores badges.
    patience: leaves when he has to read a paragraph to find a button, or click twice for what could be once.

  - id: thao
    name: Thao (data science, laptop at night)
    who: 23, master's student in data science; works days, studies after 22:00.
    goal: read the day she missed properly, understand it, and ask about what is unclear without feeling exposed.
    device: laptop, dark room, late evening; long reading sessions
    time: 60–90 minutes, once a day
    knows: statistics well, Python medium; reads carefully and checks claims.
    language: native Vietnamese; reads English well but slowly; idioms and terse labels confuse her.
    mistakes: takes labels literally; worries that pressing "unclear" is seen by the teacher as failing;
      opens many things at once and loses which one she was answering.
    patience: stays long, but stops trusting the app if a label means two things.

  - id: petra
    name: Petra Halden (the teacher)
    who: 41, teaches the course; prepares tomorrow's session the evening before.
    goal: check what students will see tomorrow and who is behind, without editing anything by accident.
    device: laptop; sometimes looks at the student view on her phone to check it
    time: 30 minutes in the evening
    knows: the content perfectly; the app's student side only from demos.
    language: native German, fluent English
    mistakes: assumes that what she sees as a student preview is exactly what students see; forgets which
      class or day she is looking at.
    patience: loses trust when she cannot tell whether students see the same thing she sees.
