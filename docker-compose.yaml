services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_doc_gen
      POSTGRES_USER: ai_doc_gen
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_doc_gen -d ai_doc_gen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
