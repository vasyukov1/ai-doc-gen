services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_doc_gen
      POSTGRES_USER: ai_doc_gen
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_doc_gen -d ai_doc_gen"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ai-doc-gen:local
    build: .
    command: migrate
    environment:
      DATABASE_URL: postgres://ai_doc_gen:local_dev_only@postgres:5432/ai_doc_gen?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ai-doc-gen:local
    pull_policy: never
    command: serve
    environment:
      DATABASE_URL: postgres://ai_doc_gen:local_dev_only@postgres:5432/ai_doc_gen?sslmode=disable
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}
      DATA_DIR: /data
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
      - sources:/data/sources:ro
      - state:/data/state
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ai-doc-gen:local
    pull_policy: never
    command: worker
    environment:
      DATABASE_URL: postgres://ai_doc_gen:local_dev_only@postgres:5432/ai_doc_gen?sslmode=disable
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}
      DATA_DIR: /data
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      UPLOAD_DIR: /data/uploads
      SOURCE_DIR: /data/sources
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://ollama:11434/v1/chat/completions}
    volumes:
      - uploads:/data/uploads
      - sources:/data/sources
      - state:/data/state
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  sources:
  state:
  ollama_models:
