{{define "head" -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    try {
      var theme = localStorage.getItem("docgen.theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (error) {
      /* The system theme is applied by CSS. */
    }
  })();
</script>
<link rel="stylesheet" href="/assets/app.css">
{{- end}}

{{define "header" -}}
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Doc Gen</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/jobs">Documents</a>
      <div class="theme-menu" data-theme-menu>
        <button class="icon-button" type="button" data-theme-trigger aria-haspopup="menu" aria-expanded="false" aria-label="Change theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"></path>
          </svg>
        </button>
        <div class="menu" data-theme-panel role="menu" aria-label="Theme" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-theme-choice="system">System</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="light">Light</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="dark">Dark</button>
        </div>
      </div>
    </nav>
  </div>
</header>
{{- end}}

{{define "footer" -}}
<footer class="shell site-footer">
  <span>Doc Gen</span>
  <span>Server-stored documents. Private access is tied to this browser session.</span>
</footer>
{{- end}}

{{define "scripts" -}}
<script src="/assets/app.js" defer></script>
{{- end}}
